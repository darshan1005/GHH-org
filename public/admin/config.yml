local_backend: true

backend:
  name: git-gateway
  branch: GHH-Live

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: "about"
    label: "About Section"
    access:
      roles: [admin, editor]
    files:
      - label: "About Content"
        name: "About"
        file: "src/Content/About.json"
        format: 'json'
        fields:
          - label: "About Us"
            name: "aboutus"
            widget: "text"
          - label: "Why Us"
            name: "whyus"
            widget: "text"
          - label: "GHH Work"
            name: "ghhwork"
            widget: "text"

  - name: "customAlert"
    label: "Custom Alert"
    access:
      roles: [admin, editor]
    files:
      - label: "Alert Content"
        name: "CustomAlert"
        file: "src/Content/CustomAlert.json"
        format: 'json'
        fields:
          - label: "Alert Message"
            name: "message"
            widget: "string"
          - label: "Show Scroll Hint"
            name: "showScrollHint"
            widget: "boolean"
            default: true
          - label: "Scroll Hint Text"
            name: "scrollHintText"
            widget: "string"
            default: "scroll down 👇"

  - name: "banner"
    label: "Banner Section"
    access:
      roles: [admin, editor]
    files:
      - label: "Banner Content"
        name: "Banner"
        file: "src/Content/Banner.json"
        format: 'json'
        fields:
          - label: "Banners"
            name: "banners"
            widget: "list"
            label_singular: "Banner Item"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Image"
                name: "image"
                widget: "image"

  - name: "blog"
    label: "Blog Posts"
    access:
      roles: [admin, editor]
    files:
      - label: "All Blog Posts"
        name: "Blog"
        file: "src/Content/Blogs.json"
        format: 'json'
        fields:
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            label_singular: "Blog Post"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Author"
                name: "author"
                widget: "string"
              - label: "Date"
                name: "date"
                widget: "datetime"
              - label: "Content"
                name: "content"
                widget: "markdown"
              - label: "Image"
                name: "image"
                widget: "image"

  - name: "gallery"
    label: "Gallery Images"
    access:
      roles: [admin, editor]
    files:
      - label: "All Gallery Images"
        name: "Gallery"
        file: "src/Content/Gallery.json"
        format: 'json'
        fields:
          - label: "Gallery Items"
            name: "images"
            widget: "list"
            label_singular: "Gallery Item"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Description"
                name: "description"
                widget: "text"
                required: false

  - name: "timeline"
    label: "Timeline Events"
    access:
      roles: [admin, editor]
    files:
      - label: "TimelineData"
        name: "TimelineData"
        file: "src/Content/Timeline.json"
        format: 'json'
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            label_singular: "Timeline Event"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Card Title"
                name: "cardTitle"
                widget: "string"
              - label: "Card Detailed Text"
                name: "cardDetailedText"
                widget: "list"
                field:
                  label: "Text Item"
                  widget: "text"
              - label: "Media"
                name: "media"
                widget: "object"
                fields:
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    options: ["IMAGE"]
                    default: "IMAGE"
                  - label: "Source"
                    name: "source"
                    widget: "object"
                    fields:
                      - label: "Image"
                        name: "url"
                        widget: "image"